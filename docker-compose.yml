name: whatsapp-agenda-system

services:
  postgres:
    image: postgres:16-alpine
    container_name: agenda_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agenda_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_STRONG_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-whatsapp_agenda}
    ports:
      - "5432:5432"
    volumes:
      - agenda_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenda_user -d whatsapp_agenda"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: agenda_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - agenda_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional: web UI to inspect the database during development
  adminer:
    image: adminer:4.8.1
    container_name: agenda_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  agenda_postgres_data:
  agenda_redis_data:
